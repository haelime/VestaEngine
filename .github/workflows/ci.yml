name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Windows ${{ matrix.configuration }} x64
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild VestaEngine.sln
          /m
          /restore
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:PreferredToolArchitecture=x64

      - name: Smoke test command line
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "x64/${{ matrix.configuration }}/VestaEngine.exe"
          if (!(Test-Path $exe)) {
            throw "Missing build output: $exe"
          }
          & $exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VestaEngine-${{ matrix.configuration }}-x64
          path: |
            x64/${{ matrix.configuration }}/VestaEngine.exe
            x64/${{ matrix.configuration }}/SDL2.dll
            x64/${{ matrix.configuration }}/shaders/**
          if-no-files-found: error
