name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.configuration }} x64
    runs-on: windows-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$sdk) {
            throw "Vulkan SDK install did not create C:\VulkanSDK"
          }
          $bin = Join-Path $sdk.FullName "Bin"
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "VULKAN_SDK=$($sdk.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            @{ Name = "SDL2"; Path = "third_party/SDL/VisualC/SDL/SDL.vcxproj" },
            @{ Name = "VestaEngine"; Path = "VestaEngine.vcxproj" }
          )
          foreach ($project in $projects) {
            $log = "msbuild-$($project.Name)-${{ matrix.configuration }}.log"
            msbuild $project.Path /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143 /p:PreferredToolArchitecture=x64 /fileLogger /flp:logfile=$log`;verbosity=normal
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $tail = (Get-Content $log -Tail 80) -join "`n"
              $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=$($project.Name) MSBuild failed::$message"
              exit $exitCode
            }
          }

      - name: Smoke test command line
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "x64/${{ matrix.configuration }}/VestaEngine.exe"
          if (!(Test-Path $exe)) {
            throw "Missing build output: $exe"
          }
          & $exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VestaEngine-${{ matrix.configuration }}-x64
          path: |
            x64/${{ matrix.configuration }}/VestaEngine.exe
            x64/${{ matrix.configuration }}/SDL2.dll
            x64/${{ matrix.configuration }}/shaders/**
          if-no-files-found: error

  release:
    name: Release Windows x64
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$sdk) {
            throw "Vulkan SDK install did not create C:\VulkanSDK"
          }
          $bin = Join-Path $sdk.FullName "Bin"
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "VULKAN_SDK=$($sdk.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          $projects = @(
            @{ Name = "SDL2"; Path = "third_party/SDL/VisualC/SDL/SDL.vcxproj" },
            @{ Name = "VestaEngine"; Path = "VestaEngine.vcxproj" }
          )
          foreach ($project in $projects) {
            $log = "msbuild-$($project.Name)-Release.log"
            msbuild $project.Path /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PreferredToolArchitecture=x64 /fileLogger /flp:logfile=$log`;verbosity=normal
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $tail = (Get-Content $log -Tail 80) -join "`n"
              $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=$($project.Name) MSBuild failed::$message"
              exit $exitCode
            }
          }

      - name: Smoke test command line
        shell: pwsh
        run: |
          & .\x64\Release\VestaEngine.exe --help

      - name: Package release
        shell: pwsh
        run: |
          $zip = "x64/VestaEngine-${{ github.ref_name }}-windows-x64.zip"
          if (Test-Path $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path "x64/Release/*" -DestinationPath $zip -Force
          Get-Item $zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VestaEngine ${{ github.ref_name }}
          files: x64/VestaEngine-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
